<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Chat Demo</title>

   <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #eef2f8;
      font-family: Arial, sans-serif;
      color: #1d2939;
    }

    .chat {
      width: min(420px, 100%);
      height: min(680px, 100vh);
      display: flex;
      flex-direction: column;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 35px #172b4d20;
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px;
      background: #263e72;
      color: white;
    }

    .avatar {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #dce8ff;
      color: #263e72;
      font-weight: bold;
    }

    .chat-header h1 {
      margin: 0 0 4px;
      font-size: 17px;
    }

    .status {
      margin: 0;
      color: #d5e2ff;
      font-size: 13px;
    }

    .messages {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 20px 14px;
      overflow-y: auto;
      background: #f8f9fc;
    }

    .message {
      max-width: 80%;
      padding: 11px 14px;
      border-radius: 16px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .message p {
      margin: 0;
    }

    .message small {
      display: block;
      margin-top: 5px;
      color: #667085;
      font-size: 11px;
      text-align: right;
    }

    .received {
      align-self: flex-start;
      background: #e9edf4;
      border-bottom-left-radius: 4px;
    }

    .sent {
      align-self: flex-end;
      background: #dce8ff;
      border-bottom-right-radius: 4px;
    }

    .chat-form {
      display: flex;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid #e5e7eb;
      background: white;
    }

    .chat-form input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid #d0d5dd;
      border-radius: 24px;
      font-size: 15px;
    }

    .chat-form input:focus {
      outline: 2px solid #9bb8ff;
      border-color: #4569bd;
    }

    .chat-form button {
      padding: 0 18px;
      border: 0;
      border-radius: 24px;
      background: #4569bd;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .chat-form button:hover {
      background: #34549d;
    }

    
  </style>
    
</head>

<body>
  <main class="chat">
    <header class="chat-header">
      <div class="avatar">M</div>
      <div>
        <h1>VIVEK</h1>
        <p class="status">Online</p>
      </div>
    </header>

    <section class="messages" id="messages" aria-label="Chat messages">
      <div class="message received">
        <p>Hey! Did you finish the design?</p>
        <small>10:42</small>
      </div>

      <div class="message sent">
        <p>Almost done — sending it soon.</p>
        <small>10:43</small>
      </div>
    </section>

    <form class="chat-form" id="chatForm">
      <input
        id="messageInput"
        type="text"
        placeholder="Write a message..."
        autocomplete="off"
        aria-label="Your message"
      >
      <button type="submit">Send</button>
    </form>

    
  </main>
 <script>
    const chatForm = document.getElementById("chatForm");
    const messageInput = document.getElementById("messageInput");
    const messages = document.getElementById("messages");

    chatForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const text = messageInput.value.trim();

      if (text === "") {
        return;
      }

      const message = document.createElement("div");
      message.className = "message sent";

      const messageText = document.createElement("p");
      messageText.textContent = text;

      const time = document.createElement("small");
      time.textContent = new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      });

      message.append(messageText, time);
      messages.appendChild(message);

      messageInput.value = "";
      messages.scrollTop = messages.scrollHeight;
      messageInput.focus();
    });
  </script>
 
</body>
</html>
