<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PASSCODE GATE</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            color: #333;
        }
        .lock-icon {
  width: 72px;
  height: 80px;
  margin: 0 auto 20px;
  position: relative;
}

.lock-shackle {
  width: 38px;
  height: 36px;
  position: absolute;
  top: 0;
  left: 17px;
  border: 6px solid #4569bd;
  border-bottom: 0;
  border-radius: 22px 22px 0 0;
}

.lock-body {
  width: 62px;
  height: 48px;
  position: absolute;
  left: 5px;
  bottom: 0;
  border-radius: 10px;
  background: #4569bd;
}

.keyhole {
  width: 9px;
  height: 9px;
  position: absolute;
  top: 12px;
  left: 27px;
  border-radius: 50%;
  background: white;
}

.keyhole::after {
  content: "";
  width: 5px;
  height: 13px;
  position: absolute;
  top: 6px;
  left: 2px;
  border-radius: 3px;
  background: white;
}
        </style>
</head>
<body>
    <h1>Passcode Gate</h1>
    <div class="lock-icon" aria-hidden="true">
  <div class="lock-shackle"></div>
  <div class="lock-body">
    <div class="keyhole"></div>
  </div>
</div>
</body>
</html>
