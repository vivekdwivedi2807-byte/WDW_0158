<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unlock Chat</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #eef2f8;
      font-family: Arial, sans-serif;
      color: #1d2939;
    }

    .unlock-card {
      width: min(380px, calc(100% - 32px));
      padding: 36px 28px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 12px 35px #172b4d20;
      text-align: center;
    }

    /* CSS-drawn lock */
    .lock-icon {
      width: 72px;
      height: 80px;
      margin: 0 auto 20px;
      position: relative;
    }

    .lock-shackle {
      width: 38px;
      height: 36px;
      position: absolute;
      top: 0;
      left: 17px;
      border: 6px solid #4569bd;
      border-bottom: 0;
      border-radius: 22px 22px 0 0;
    }

    .lock-body {
      width: 62px;
      height: 48px;
      position: absolute;
      left: 5px;
      bottom: 0;
      border-radius: 10px;
      background: #4569bd;
    }

    .keyhole {
      width: 9px;
      height: 9px;
      position: absolute;
      top: 12px;
      left: 27px;
      border-radius: 50%;
      background: white;
    }

    .keyhole::after {
      content: "";
      width: 5px;
      height: 13px;
      position: absolute;
      top: 6px;
      left: 2px;
      border-radius: 3px;
      background: white;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .description {
      margin: 0 0 24px;
      color: #667085;
      font-size: 14px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 8px;
      text-align: left;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      font-size: 18px;
      letter-spacing: 8px;
      text-align: center;
    }

    input:focus {
      outline: 2px solid #9bb8ff;
      border-color: #4569bd;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #4569bd;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #34549d;
    }

    #message {
      min-height: 20px;
      margin: 14px 0 0;
      font-size: 14px;
    }

    .demo-note {
      margin: 24px 0 0;
      color: #858d9b;
      font-size: 12px;
    }
  </style>
 
</head>

<body>
  <main class="unlock-card">
    <div class="lock-icon" aria-hidden="true">
      <div class="lock-shackle"></div>
      <div class="lock-body">
        <div class="keyhole"></div>
      </div>
    </div>

    <h1>Unlock this chat</h1>
    <p class="description">Enter the passcode to continue.</p>

    <form id="unlockForm">
      <label for="passcode">Passcode</label>
      <input
        id="passcode"
        type="password"
        inputmode="numeric"
        maxlength="4"
        placeholder="••••"
        autocomplete="off"
        required
      >
      <button type="submit">Unlock chat</button>
    </form>

    <p id="message" role="status"></p>
    <p class="demo-note">Demo passcode: 1234</p>
  </main>

  <script>
    const unlockForm = document.getElementById("unlockForm");
    const passcodeInput = document.getElementById("passcode");
    const message = document.getElementById("message");
     
    unlockForm.addEventListener("submit", function (event) {
      event.preventDefault();

      if (passcodeInput.value === "1234") {
        window.location.href = "index.html";
      } else {
        message.textContent = "Incorrect passcode. Try again.";
        message.style.color = "#c0392b";
        passcodeInput.value = "";
        passcodeInput.focus();
      }
    });
  </script>
</body>
</html>
