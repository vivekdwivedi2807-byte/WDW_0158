<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unordered, Ordered and Description Lists</title>
</head>
<body>
    <h1>Unordered</h1>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <h1>Ordered</h1>
    <ol>
        <li>Install VS Code</li>
        <li>Create file</li>
        <li>Open in browser</li>
    </ol>

    <h1>Description</h1>
    <dl>
        <dt>HTML</dt>
        <dd>HyperText Markup Language</dd>
        <dt>CSS</dt>
        <dd>Cascading Style Sheets</dd>
        <dt>JavaScript</dt>
        <dd>A programming language for web development</dd>
    </dl>
</body>
</html>
