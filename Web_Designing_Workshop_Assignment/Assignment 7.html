
    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assignment 7: Navigation Menu Using Lists</title>
  <style>
    
    ul {
      list-style-type: none; 
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #2b2b2b;
    }

    
    li {
      float: left;
    }

    
    li a {
      display: block;
      color: white;
      text-align: center;
      padding: 16px 24px; 
      text-decoration: none; 
      font-family: Georgia, serif;
      font-size: 18px;
    }

    li a:hover {
      background-color: #111111;
    }
  </style>
</head>
<body>

  <ul>
    <li><a href="#home">Home</a></li>
    <li><a href="#about">About</a></li>
    <li><a href="#courses">Courses</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>

</body>
</html>
