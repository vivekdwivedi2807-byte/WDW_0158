<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Feedback Form</title>
</head>
<body>
    <header>
      <h1>Hotel Feedback Form</h1>
      <p>Thank you for staying with us. Please provide feedback on your recent stay.</p>
    </header>
    <main>
        <form method="POST"  action="https://hotel-feedback.freecodecamp.org">
          <fieldset>
             <legend >Personal Information</legend> 
               <label for="full-name">Name (required): </label>
          <input type="text" id="full-name" name="name"  placeholder="e.g., John Doe" size="20" required><br><br>
            <label for="email">Email address (required):</label>
          <input type="email" id="Email address"  name="email" placeholder="e.g., vivek123@gmail.com" size="20" required>
            <label for="age">Age (optional):</label>
              <input type="number" id="age" name="age" min="3" max="100" size="20">
      </fieldset>  
        <fieldset>
          <legend>Was this your first time at our hotel?</legend>
           <input type="radio" id="yes-option" name="hotel-stay" value="yes">
        <label for="yes-option">Yes</label>  
         <input type="radio" id="yes-option" name="hotel-stay" value="yes">
        <label for="yes-option">Yes</label>  
        </fieldset> 
        <fieldset>
          <legend>Why did you choose to stay at our hotel? (Check all that apply)</legend>
           <input type="checkbox" id="ads" name="choice" value="ads" >
          <label for="ads">Social Media Ads</label>
           <input
            type="checkbox"
            id="recommendation"
            name="choice"
            value="recommendation"
          >
          <label for="recommendation">Personal Recommendation</label>
           <input 
             type="checkbox"
             id="location"
             value="location"
             name="choice">
          <label for="location">Location</label>
          <input checked 
             type="checkbox"
             id="reputation"
             value="reputation"
             name="choice">
          <label for='reputation'>Reputation</label> 

            <input id="price" value="price" name="choice" type="checkbox">
          <label for="price">Price</label> 
        </fieldset>
        
        <fieldset>
          <legend>Ratings</legend>
          <label for="service">How was the service?</label>
             <select name="service" id="service">
           <option value="poor">Poor</option>  
           <option value="satisfactory">Satisfactory</option> 
           <option value="good">Good</option> 
           <option value="very-good">Very Good</option> 
           <option selected value="excellent">Excellent</option> 
          </select>
        </fieldset>
    </form>
    </main>
</body>
</html>
