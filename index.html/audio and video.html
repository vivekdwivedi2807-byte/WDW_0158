<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia PLayer</title>
</head>
<body>
    <h1 align="center" style="color: red;">Multimedia Player</h1>
    <h2>Audio Section</h2>
    <audio controls>
        <source src="audio/sample-song.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <h2>Video Section</h2>
    
        
        <iframe
        width="560" height="315" controls
        src="https://www.youtube.com/embed/vGoiqOA6O2g?si=1PwE6Rz_32WOgWAu"
         title="YouTube video player" frameborder="0" 
         allow="accelerometer; autoplay; clipboard-write; encrypted-media; 
         gyroscope; picture-in-picture; web-share" 
         referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
        </iframe>   
        Your browser does not support the video element.
    </video>
</body>
</html>
